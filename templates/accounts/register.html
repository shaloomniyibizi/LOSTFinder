{% extends "base_public.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 fw-bold mb-1">Create an account</h1>
                <p class="text-secondary">Register to report lost or found property on campus.</p>

                {% include "accounts/_register_form.html" with prefix="page-" modal=False %}

                <p class="mt-3 mb-0 small text-center">
                    Already registered? <a href="{% url 'login' %}">Sign in</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
